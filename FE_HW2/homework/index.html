<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="user-container" class="user-container"></div>
    <div id="edit-form" class="edit-form hidden">
      <input type="text" id="edit-name" placeholder="Name" />
      <input type="text" id="edit-username" placeholder="Username" />
      <input type="text" id="edit-phone" placeholder="Phone" />
      <input type="text" id="edit-website" placeholder="Website" />
      <input type="text" id="edit-email" placeholder="Email" />
      <button id="save-button">Send</button>
    </div>
    <div id="loader" class="loader"></div>
    <script src="js/index.js"></script>
  </body>
</html>
